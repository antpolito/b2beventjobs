name: Instagram Stories

on:
  schedule:
    # Each slot has two UTC crons so it fires correctly in both EDT and EST; src/run.mjs skips the wrong twin.
    - cron: "15 14 * * *"     # Event Job of the Day   10:15 ET
    - cron: "15 15 * * *"
    - cron: "15 19 * * *"     # Remote Job of the Day  3:15 pm ET
    - cron: "15 20 * * *"
    - cron: "20 13 * * 5"     # Friday Roundup         Fri 9:20 am ET
    - cron: "20 14 * * 5"
    - cron: "25 16 * * 2,4"   # Trending Jobs          Tue/Thu 12:25 pm ET
    - cron: "25 17 * * 2,4"
  workflow_dispatch:
    inputs:
      kind:  { description: "event | remote | roundup | trending", required: true, default: event }
      dry:   { description: "Dry run (render only, don't post)", type: boolean, default: true }
      force: { description: "Ignore 'already posted today' and time-of-day checks", type: boolean, default: true }

permissions:
  contents: write

concurrency:
  group: stories
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run
        env:
          BASE44_API_KEY:          ${{ secrets.BASE44_API_KEY }}            # B2BEVENTJOBS.COM app (JobListing)
          BASE44_LINKEDIN_API_KEY: ${{ secrets.BASE44_LINKEDIN_API_KEY }}   # Lyra app (LinkedInJobPost)
          IG_USER_ID:      ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_BASE:   ${{ vars.IG_GRAPH_BASE }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node src/run.mjs --schedule "${{ github.event.schedule }}"
          else
            node src/run.mjs --kind "${{ inputs.kind }}" ${{ inputs.dry && '--dry' || '' }} ${{ inputs.force && '--force' || '' }}
          fi
      - name: Keep dry-run images
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry }}
        uses: actions/upload-artifact@v4
        with: { name: story-preview, path: docs/stories/*.jpg, if-no-files-found: ignore }
